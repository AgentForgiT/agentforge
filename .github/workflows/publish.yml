name: Publish to PyPI and Attach Release Assets

on:
  push:
    tags:
      - "Genesis-*"
      - "0.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build twine
      - name: Build CLI package
        run: python -m build --outdir dist-cli apps/cli
      - name: Build SDK package
        run: python -m build --outdir dist-sdk apps/sdk
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist-cli/
            dist-sdk/
          retention-days: 7

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        if: env.PYPI_TOKEN != ''
        run: |
          pip install twine
          find dist -name '*.whl' -o -name '*.tar.gz' | xargs twine upload -u __token__ -p "$PYPI_TOKEN" --non-interactive

  attach-release-assets:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Attach wheels to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # debug: show what the API actually returns
          curl -sS -o /tmp/release.json -w "api_status=%{http_code}\n" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GH_REPO/releases/tags/$TAG" || true
          head -c 300 /tmp/release.json || true
          echo ""
          # wait for the release to exist (it may be created after the tag push)
          for i in $(seq 1 30); do
            if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
              break
            fi
            echo "waiting for release $TAG (attempt $i)..."
            sleep 10
          done
          gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1 || { echo "release $TAG not found after waiting"; exit 1; }
          find dist -name '*.whl' -o -name '*.tar.gz' | while read -r f; do
            gh release upload "$TAG" "$f" --repo "$GH_REPO" --clobber
          done

  benchmarks:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline benchmark harness
        run: python benchmarks/run_benchmarks.py --samples 5
      - name: Regression gate vs previous release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release list --repo "$GH_REPO" --limit 20 --json tagName --jq '.[].tagName' > /tmp/tags.txt
          PREV_TAG=""
          while IFS= read -r t; do
            if [ "$t" = "$TAG" ]; then
              break
            fi
            PREV_TAG="$t"
          done < /tmp/tags.txt
          if [ -z "$PREV_TAG" ]; then
            echo "no previous release found — skipping regression gate"
          else
            echo "gating against previous release: $PREV_TAG"
            gh release download "$PREV_TAG" --repo "$GH_REPO" --pattern "results.json" --dir /tmp/prev || true
            if [ -f /tmp/prev/results.json ]; then
              python benchmarks/check_regressions.py --previous /tmp/prev/results.json --current benchmarks/results.json --threshold 10
            else
              echo "previous release $PREV_TAG has no results.json — skipping regression gate"
            fi
          fi
      - name: Attach benchmark results to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          for i in $(seq 1 30); do
            if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1 || { echo "release $TAG not found after waiting"; exit 1; }
          gh release upload "$TAG" benchmarks/results.json --repo "$GH_REPO" --clobber
